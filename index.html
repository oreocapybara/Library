<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Project Library</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="container">
			<nav>
				<h1>My Library</h1>
				<!--Add button-->
				<button class="add-btn">Add Book</button>
			</nav>

			<!--Modal-->
			<dialog closedby="any">
				<form>
					<div>
						<label for="title">Title<span>*</span> </label>
						<input
							id="title"
							name="title"
							type="text"
							placeholder="Enter book title"
							required
						/>
					</div>

					<div>
						<label for="author">Author<span>*</span> </label>
						<input
							id="author"
							name="author"
							type="text"
							placeholder="Enter book author"
							required
						/>
					</div>

					<div>
						<div>
							<label for="pages">Pages</label>
							<input
								id="pages"
								name="pages"
								type="number"
								placeholder="1-9999"
								default="1"
								min="1"
								max="9999"
							/>
						</div>

						<div>
							<label for="read">Read?</label>
							<input id="read" name="read" type="checkbox" />
						</div>
					</div>

					<button type="submit"> Save</button>
				</form>
			</dialog>

			<!--Display area for books-->
			<div class="book-container"></div>
		</div>

		<script src="./script.js" defer></script>
	</body>
</html>
